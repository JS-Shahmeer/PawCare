name: Android test APK

# Builds an installable APK for testing on a phone. It is signed with the
# Android debug key, so it is for testing only, not for the Play Store.
on:
  workflow_dispatch:
  push:
    branches: [main, 'build/**']

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "pawcare-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pawcare-android-apk
          path: pawcare-*.apk
          retention-days: 30
